<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Jamie Setch</title>
    <meta
      name="description"
      content="Jamie Setch — NeuroAI researcher at the University of Cambridge. Spiking neural networks, brain–computer interfaces and brain-inspired robot control."
    />
    <meta name="theme-color" content="#000000" />
    <!-- no tab icon: a blank one stops browsers fetching /favicon.ico -->
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR4nGNgAAIAAAUAAXpeqz8AAAAASUVORK5CYII=" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&display=swap"
    />
    <link rel="stylesheet" href="/css/style.css?v=2026-11-27l" />
    <script src="/js/time-of-day.js?v=2026-11-27l"></script>
  </head>
  <body class="home">
    <div class="tide-frame">
      <canvas
        id="night-tide"
        role="img"
        aria-label="Animated ASCII art: waves rolling in and breaking on a beach at night, with moonlight glittering on the water"
      ></canvas>
    </div>
    <header role="banner">
      <nav role="navigation" aria-label="Main">
        <ul>
          <li><a href="/" class="active" aria-current="page">Home</a></li>
          <li><a href="/about/">About</a></li>
          <li><a href="/projects/">Projects</a></li>
        </ul>
      </nav>
    </header>
    <main id="main" role="main">
      <h1 class="visually-hidden">Jamie Setch</h1>
      <!-- a camera half-buried in the sand: an unlabelled easter egg that opens Travels -->
      <a class="camera-link" href="/travels/" aria-label="Travels">
        <svg viewBox="0 0 120 80" aria-hidden="true" focusable="false">
          <defs>
            <!-- everything above the sand line; the camera's base is hidden below it -->
            <clipPath id="camera-above-sand"><path d="M0 63 Q30 60 58 61.5 T120 61 V-20 H0 Z" /></clipPath>
            <linearGradient id="camera-sand-ridge" x1="0" x2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="0.25" stop-color="#fff" stop-opacity="0.65" />
              <stop offset="0.75" stop-color="#fff" stop-opacity="0.65" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <radialGradient id="camera-glass" cx="0.38" cy="0.35" r="0.75">
              <stop offset="0" stop-color="#6f8fd0" />
              <stop offset="0.55" stop-color="#28306a" />
              <stop offset="1" stop-color="#0e1024" />
            </radialGradient>
          </defs>
          <g class="cam" clip-path="url(#camera-above-sand)">
            <g transform="rotate(-9 60 46)">
              <rect class="silver" x="55" y="9.5" width="12" height="4.5" rx="1" />
              <path class="silver" d="M44 26 L50 14 H72 L78 26" />
              <rect class="silver" x="84" y="20" width="10" height="6" rx="1.5" />
              <rect class="leather" x="14" y="26" width="92" height="44" rx="6" />
              <path class="silver" d="M14 34 V32 A6 6 0 0 1 20 26 H100 A6 6 0 0 1 106 32 V34 Z" />
              <rect class="window" x="86" y="36" width="12" height="8" rx="1.5" />
              <circle cx="20" cy="30" r="1.6" />
              <circle cx="100" cy="30" r="1.6" />
              <circle class="badge" cx="25" cy="40" r="1.8" />
              <circle class="barrel" cx="60" cy="48" r="17" />
              <circle cx="60" cy="48" r="12.5" />
              <circle class="glass" cx="60" cy="48" r="7.5" />
              <path class="glint" d="M55 45.5 A6 6 0 0 1 59 42.2" />
            </g>
          </g>
          <path class="sand" d="M0 63 Q30 60 58 61.5 T120 61" />
          <g class="grains">
            <circle cx="18" cy="66" r="0.7" /><circle cx="31" cy="64.5" r="0.6" /><circle cx="47" cy="66.5" r="0.7" />
            <circle cx="69" cy="65" r="0.6" /><circle cx="84" cy="66.5" r="0.7" /><circle cx="99" cy="64.5" r="0.6" />
          </g>
        </svg>
      </a>
    </main>
    <script src="/js/night-tide.js?v=2026-11-27l" defer></script>
    <script src="/js/zoom-nav.js?v=2026-11-27l" defer></script>
  </body>
</html>
