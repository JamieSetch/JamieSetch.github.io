<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jamie Setch</title>
    <meta
      name="description"
      content="Official website of Jamie Setch. New frontend rebuild in progress."
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body class="splash-active">
    <div id="splash-screen" class="splash-screen" aria-hidden="true">
      <p class="splash-title">
        <span class="splash-word splash-word-jamie">Jamie</span>
        <span class="splash-word splash-word-setch">Setch</span>
      </p>
    </div>

    <div class="promo-bar">SAVE AN EXTRA 30% OFF SALE</div>

    <header class="main-header">
      <div class="logo-group">
        <a class="logo-wordmark" href="/" aria-label="Jamie Setch home">Jam<span class="logo-i-letter">i<img
              class="logo-i-dot"
              src="./assets/JamieSetchLogo.png"
              alt=""
              aria-hidden="true"
          /></span>e Setch</a>
        <p class="logo-sub">CAMBRIDGE</p>
      </div>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="/">HIS</a>
        <a href="/">HERS</a>
        <a href="/">THEIRS</a>
        <a href="/">ABOUT</a>
      </nav>

      <div class="icon-actions" aria-label="Header actions">
        <button type="button" class="icon-btn" aria-label="Search">
          <span class="icon-sprite icon-search" aria-hidden="true"></span>
        </button>
        <button type="button" class="icon-btn" aria-label="Account">
          <span class="icon-sprite icon-account" aria-hidden="true"></span>
        </button>
        <button type="button" class="icon-btn" aria-label="Bag">
          <span class="icon-sprite icon-bag" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <script src="./js/main.js"></script>
  </body>
</html>
